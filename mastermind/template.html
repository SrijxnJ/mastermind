<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Srijan's Master Mind</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a living brain map (canvas) beside an operating panel; the knowledge spectrum runs across the top.
   One deliberate dark world: a brain glowing in a dark room. Fonts are the ones Srijan's own reels use. */
:root{
  --bg:#0a0c13; --panel:#10131d; --panel-2:#151927; --line:#232a3c; --fg:#ecebf4; --muted:#9aa0b6; --dim:#5f6682;
  --spark:#ffd27a; --clash:#ff5d73; --have:#5fd39a; --partial:#ffc861; --missing:#ff6b81;
  --c-content:#ffb547; --c-visual:#5cc8ff; --c-sound:#b18cff; --c-filming:#4fd1b5; --c-strategy:#ff7aa8;
  --display:'Anton', Impact, 'Arial Narrow', sans-serif;
  --body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html,body{background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}
body{font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 28px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--spark);outline-offset:2px;border-radius:6px}
a{color:var(--spark)}
.app{max-width:1500px;margin:0 auto;display:grid;gap:14px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;justify-content:space-between}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5vw,54px);letter-spacing:.02em;line-height:.95;margin:0;text-transform:uppercase}
.brand h1 span{color:var(--spark)}
.brand p{margin:4px 0 0;font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums}
.stat{display:grid;line-height:1.1}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.02em}
.stat small{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat.warn b{color:var(--clash)}
.searchbox{flex:1 1 260px;max-width:420px;position:relative}
.searchbox input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:10px 16px 10px 38px;font:inherit}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.6}
.searchbox .count{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted)}

/* spectrum */
.spectrum{display:grid;gap:8px}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;gap:2px}
.bar button{height:100%;min-width:3px;padding:0;transition:filter .2s, opacity .2s}
.bar button:hover{filter:brightness(1.3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.legend button{display:inline-flex;align-items:center;gap:6px;padding:2px 0}
.legend button[aria-pressed="false"]{opacity:.35}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.legend .hint{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}

/* main */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:14px;align-items:start}
.brain{position:relative;height:min(78vh,820px);min-height:420px;background:radial-gradient(ellipse at 50% 45%, #151a2c 0%, var(--bg) 70%);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.brain canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.brain canvas.hovering{cursor:pointer}
.tip{position:absolute;pointer-events:none;background:rgba(10,12,19,.92);border:1px solid var(--line);padding:4px 8px;border-radius:8px;font-size:12.5px;max-width:260px;transform:translate(-50%,-130%);white-space:normal}
.mode{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 28px)}
.mode b{color:var(--spark);font-weight:500}
.mode button{border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--panel)}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:32px;height:32px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-family:var(--mono)}

.inspect{position:absolute;left:12px;right:12px;bottom:12px;max-height:48%;overflow:auto;background:rgba(16,19,29,.96);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.inspect .close{position:absolute;right:10px;top:8px;font-size:20px;color:var(--muted);width:30px;height:30px}
.inspect h2{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1;margin:4px 30px 6px 0;text-wrap:balance}
.inspect p{margin:6px 0;max-width:70ch}
.inspect .how{color:var(--fg);border-left:2px solid var(--spark);padding-left:10px}
.inspect blockquote{margin:8px 0;font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12.5px;background:var(--panel-2);white-space:nowrap}
button.chip:hover{border-color:var(--muted)}
.chip.clash{border-color:rgba(255,93,115,.5);color:#ffb3be}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.have{border-color:rgba(95,211,154,.5);color:#a6ecc8}.chip.partial{border-color:rgba(255,200,97,.5);color:#ffe0a3}.chip.missing{border-color:rgba(255,107,129,.55);color:#ffb3be}
.ev{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-width:0;height:min(78vh,820px);min-height:420px}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{padding:7px 11px;border-radius:10px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--spark)}
.view{padding:14px 16px 18px;overflow:auto;flex:1;min-height:0}
.view h3{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:16px 0 6px}
.view h3:first-child{margin-top:0}
.view .sub{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;background:var(--panel-2)}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stage{margin:12px 0 4px;display:flex;align-items:baseline;gap:8px}
.stage b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.stage span{font-family:var(--mono);font-size:11px;color:var(--dim)}
.items{display:grid;gap:4px}
.item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:start;text-align:left;padding:6px 8px;border-radius:10px;width:100%}
.item:hover{background:var(--panel-2)}
.item .dot{margin-top:6px}
.item .tt{font-weight:500;font-size:14px}
.item .xx{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:1px}
.item .badge{font-family:var(--mono);font-size:10.5px;color:#ffb3be;border:1px solid rgba(255,93,115,.45);border-radius:6px;padding:0 5px;margin-top:3px}
.item .badge.n{color:var(--spark);border-color:rgba(255,210,122,.4)}
.card{box-sizing:border-box;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--panel-2);display:block;width:100%;text-align:left;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .nm{font-weight:600}
.card p{margin:4px 0;color:var(--muted);font-size:13.5px}
.heat{font-family:var(--mono);font-size:11px;color:var(--spark);white-space:nowrap}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:12px;padding:12px}

/* ask */
.ask textarea{width:100%;box-sizing:border-box;min-height:84px;resize:vertical;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit}
.askbar{display:flex;gap:8px;margin:8px 0 10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--spark);color:#1a1405;font-weight:600;border-radius:999px;padding:8px 16px}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.answer{font-size:14.5px;line-height:1.55}
.answer p{margin:6px 0}
.answer ul{margin:6px 0;padding-left:18px}
.answer li{margin:3px 0}
.cite{display:inline;border-bottom:1px dotted var(--spark);color:var(--spark);font-size:.92em;padding:0}
.cite.c{color:#ffb3be;border-color:var(--clash)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.looks{margin:8px 0;font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.35;color:var(--fg);border-left:2px solid var(--spark);padding-left:10px}
.opt{cursor:default}
.think{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:17px}

/* library */
.lib-item{border-bottom:1px solid var(--line);padding:8px 0;display:grid;gap:3px}
.lib-item .hd{display:flex;gap:8px;align-items:center;justify-content:space-between}
.lib-item .nm{font-weight:600}
.lib-item p{margin:0;color:var(--muted);font-size:13.5px}
.play{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.play:hover{border-color:var(--spark);color:var(--spark)}
.filter{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 10px;font:inherit;margin-bottom:8px}

/* worlds & nav */
.nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:center}
.nav{flex-wrap:wrap}
.nav button{padding:7px 16px;border-radius:999px;font-family:var(--display);letter-spacing:.07em;text-transform:uppercase;font-size:16px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--spark);color:#1a1405}
.world{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.world > *{min-width:0}
.step,.pattern,.fw,.card,.frame,.phase li,.copybox{min-width:0;overflow-wrap:anywhere}
.steps{grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))}
.ctable{max-width:100%}
.maprow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:.92;margin:0;text-wrap:balance}
.serif{font-family:var(--serif);font-style:italic}

/* learn shelf */
.shelf-head{display:grid;gap:6px;max-width:75ch}
.shelf-head .display{font-size:clamp(40px,6vw,72px)}
.shelf-head p{color:var(--muted);margin:0;font-size:16px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.course{position:relative;border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(160deg,var(--panel-2),var(--panel) 70%);text-align:left;display:grid;gap:8px;align-content:start;min-height:230px;overflow:hidden;cursor:pointer;transition:border-color .2s, transform .2s}
.course:hover{border-color:var(--muted);transform:translateY(-2px)}
.course svg.ring{position:absolute;right:-34px;top:-34px;width:178px;height:178px}
.course .len{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--spark);max-width:58%}
.course h3{font-family:var(--display);font-weight:400;font-size:27px;line-height:.98;text-transform:uppercase;margin:0;max-width:72%;text-wrap:balance}
.course .by{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted)}
.course p{color:var(--muted);font-size:14px;margin:0}
.course .meter{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:auto}
.course .meter i{display:block;height:100%;background:var(--spark)}
.course.big{grid-column:span 2}
@media (max-width:640px){.course.big{grid-column:auto}}

/* reader */
.reader{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.rail{position:sticky;top:max(12px, env(safe-area-inset-top, 0px));max-height:calc(100vh - 24px);overflow:auto;display:grid;gap:2px;padding-right:4px}
.rail .back{margin-bottom:10px;justify-self:start}
.rail .chl{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;padding:6px 8px;border-radius:10px;color:var(--muted);text-align:left;font-size:13.5px;line-height:1.3}
.rail .chl:hover{background:var(--panel-2);color:var(--fg)}
.rail .chl b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--dim)}
.rail .chl.done b{color:var(--have)}
.course-body{min-width:0;max-width:980px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;align-items:center;padding-bottom:10px}
.hero h1{font-size:clamp(40px,7vw,92px)}
.hero .by{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted);margin-top:8px}
.hero .one{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.6vw,32px);line-height:1.18;margin:14px 0 0;max-width:30ch}
.hero svg{width:100%;height:auto}
.bigidea{border:1px solid var(--line);border-radius:20px;padding:20px;background:radial-gradient(ellipse at 0% 0%, rgba(255,210,122,.12), transparent 60%), var(--panel);display:grid;gap:10px}
.bigidea .display{font-size:clamp(26px,3.4vw,40px)}
.bigidea ul{margin:0;padding-left:18px;color:var(--muted)}
.map-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.map-strip a{border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-decoration:none;color:var(--fg);font-size:13px;display:grid;gap:2px}
.map-strip a span{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
.chapter{border-top:1px solid var(--line);padding-top:28px;margin-top:30px;scroll-margin-top:16px}
.ch-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:end;margin-bottom:10px}
.ch-head .num{font-family:var(--display);font-size:clamp(56px,8vw,96px);line-height:.78}
.ch-head h2{font-size:clamp(26px,3.6vw,44px)}
.ch-head .time{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.ch-sum{font-size:16.5px;line-height:1.6;max-width:68ch;margin:0 0 18px}
.blocks{display:grid;gap:16px}
.blocks.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.fw{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--panel);min-width:0}
.fw-title{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:20px;margin:0 0 12px}
.fw-cap{color:var(--muted);font-size:13.5px;margin:12px 0 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;counter-reset:s}
.step{position:relative;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.step .n{font-family:var(--display);font-size:34px;line-height:.9;color:var(--c,var(--spark))}
.step b{display:block;margin:6px 0 4px;font-size:15px}
.step p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.layers{display:grid;gap:6px;justify-items:center}
.layer{box-sizing:border-box;padding:10px 16px;text-align:center;border-radius:6px;color:#16120a;min-height:44px;display:grid;align-content:center}
.layer b{font-size:14.5px}
.layer span{font-size:12.5px;opacity:.85}
.ladder{display:grid;gap:0;position:relative;padding-left:26px}
.ladder::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--c-visual),var(--c-content))}
.rung{position:relative;padding:8px 0 8px 10px;border-bottom:1px dashed var(--line)}
.rung::before{content:"";position:absolute;left:-23px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--spark)}
.rung b{display:block}.rung span{color:var(--muted);font-size:13.5px}
.ladder .end{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;padding:2px 0 2px 10px}
.matrix{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:1fr 1fr 28px;gap:8px}
.matrix .cell{border-radius:12px;padding:12px;background:var(--panel-2);border:1px solid var(--line)}
.matrix .cell b{display:block}.matrix .cell span{color:var(--muted);font-size:13.5px}
.matrix .ax{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;display:grid;place-items:center}
.matrix .ay{writing-mode:vertical-rl;transform:rotate(180deg)}
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;position:relative}
.tl .pt{border-top:2px solid var(--spark);padding-top:10px;position:relative}
.tl .pt::before{content:"";position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--spark)}
.tl .pt b{display:block}.tl .pt span{color:var(--muted);font-size:13.5px}
.eq{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px}
.eq .tile{flex:1 1 140px;border-radius:14px;padding:12px;background:var(--panel-2);border:1px solid var(--line)}
.eq .tile.res{background:var(--spark);color:#1a1405;border-color:var(--spark)}
.eq .op{font-family:var(--display);font-size:34px;color:var(--spark);display:grid;place-items:center}
.eq .tile b{display:block}.eq .tile span{font-size:13.5px;opacity:.8}
.svgfw{display:grid;grid-template-columns:minmax(180px,280px) minmax(0,1fr);gap:16px;align-items:center}
.svgfw svg{width:100%;height:auto}
.legend-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.legend-list li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px}
.legend-list li i{font-style:normal;font-family:var(--display);font-size:20px;color:var(--c,var(--spark))}
.legend-list b{display:block}.legend-list span{color:var(--muted);font-size:13.5px}
.bq{margin:0;padding:6px 0 6px 18px;border-left:3px solid var(--spark)}
.bq p{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.8vw,32px);line-height:1.18;margin:0}
.bq cite{display:block;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px;letter-spacing:.06em}
.statb{border-radius:18px;padding:18px;background:var(--panel);border:1px solid var(--line)}
.statb .v{font-family:var(--display);font-size:clamp(48px,7vw,84px);line-height:.9;color:var(--spark)}
.statb b{display:block;margin-top:6px}.statb span{color:var(--muted);font-size:13.5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp > div{border-radius:14px;padding:14px;border:1px solid var(--line)}
.cmp .l{background:rgba(255,93,115,.07);border-color:rgba(255,93,115,.3)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const D = /*__DATA__*/null;

/* ---------- lookup tables ---------- */
const FAM = {content:'#ffb547', visual:'#5cc8ff', sound:'#b18cff', filming:'#4fd1b5', strategy:'#ff7aa8'};
const byId = new Map(D.atoms.map(a => [a.id, a]));
const topicById = new Map(D.topics.map(t => [t.id, t]));
const clashById = new Map(D.clashes.map(c => [c.id, c]));
const srcById = new Map(D.sources.map(s => [s.id, s]));
const trendById = new Map(D.trends.map(t => [t.id, t]));
const fmtLabel = Object.fromEntries(D.formats.map(f => [f.id, f.label]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get(k, d){ try{ const v = localStorage.getItem('mm:'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
                set(k, v){ try{ localStorage.setItem('mm:'+k, JSON.stringify(v)); }catch(e){} } };

// topic colours: family hue, stepped lightness inside the family
D.topics.forEach(t => {
  const sibs = D.topics.filter(x => x.family === t.family), i = sibs.indexOf(t);
  const c = d3.hsl(FAM[t.family]); c.l = Math.min(.82, Math.max(.45, c.l + (i - (sibs.length - 1) / 2) * .075));
  t.color = c.formatHex();
});
const colorOf = a => topicById.get(a.tp)?.color || '#888';

/* ---------- header ---------- */
const C = D.meta.counts;
document.getElementById('stats').innerHTML = [
  ['ideas', C.atoms], ['neural links', C.links], ['sources', C.sources], ['approaches', C.options || 0],
  ['live trends', C.trends], ['sounds', C.sfx], ['memes', C.memes], ['transitions', C.transitions]
].map(([l, n, cls]) => `<div class="stat ${cls||''}"><b>${n}</b><small>${l}</small></div>`).join('');

const famOn = store.get('fams', Object.fromEntries(Object.keys(FAM).map(k => [k, true])));
function drawSpectrum(){
  document.getElementById('bar').innerHTML = D.topics.filter(t => t.n).map(t =>
    `<button style="flex:${t.n};background:${t.color};opacity:${famOn[t.family]?1:.25}" title="${esc(t.label)}: ${t.n} ideas" aria-label="${esc(t.label)}, ${t.n} ideas" data-topic="${t.id}"></button>`).join('');
  document.getElementById('legend').innerHTML = Object.entries(D.families).map(([k, l]) =>
    `<button aria-pressed="${famOn[k]}" data-fam="${k}"><span class="dot" style="background:${FAM[k]}"></span>${esc(l)}</button>`).join('')
    + `<span class="hint">drag · pinch · tap a dot</span>`;
}
drawSpectrum();
document.getElementById('bar').onclick = e => { const b = e.target.closest('[data-topic]'); if (b) selectTopic(b.dataset.topic); };
document.getElementById('legend').onclick = e => {
  const b = e.target.closest('[data-fam]'); if (!b) return;
  famOn[b.dataset.fam] = !famOn[b.dataset.fam]; store.set('fams', famOn); drawSpectrum(); wake();
};

/* ---------- graph model ---------- */
const W0 = 1000, H0 = 720;
(function placeTopics(){
  const fams = Object.keys(FAM), gap = .8, slots = D.topics.length + fams.length * gap;
  let k = 0, last = null;
  D.topics.forEach(t => {
    if (last && t.family !== last) k += gap; last = t.family;
    const ang = -Math.PI / 2 + (k + .5 + gap / 2) / slots * Math.PI * 2; k++;
    t.cx = W0 / 2 + Math.cos(ang) * W0 * .34; t.cy = H0 / 2 + Math.sin(ang) * H0 * .34;
  });
})();
function rng(seed){ let h = 2166136261; for (const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }

const nodes = [], links = [], nodeById = new Map();
D.topics.forEach(t => { const n = {id:'T:'+t.id, kind:'topic', ref:t, r:9 + Math.sqrt(t.n) * 1.6, x:t.cx, y:t.cy, fx:t.cx, fy:t.cy, cx:t.cx, cy:t.cy, color:t.color, fam:t.family}; nodes.push(n); nodeById.set(n.id, n); });
D.atoms.forEach(a => {
  const t = topicById.get(a.tp), r = rng(a.id);
  const n = {id:a.id, kind:'atom', ref:a, r:3.2, x:t.cx + (r() - .5) * 60, y:t.cy + (r() - .5) * 60, cx:t.cx, cy:t.cy, color:t.color, fam:t.family};
  nodes.push(n); nodeById.set(n.id, n); links.push({source:n.id, target:'T:'+a.tp, kind:'home'});
});
const seen = new Set();
D.atoms.forEach(a => a.nb.forEach(b => {
  const key = a.id < b ? a.id + '|' + b : b + '|' + a.id;
  if (!seen.has(key) && byId.has(b)) { seen.add(key); links.push({source:a.id, target:b, kind:'syn'}); }
}));
D.trends.forEach(t => {
  const n = {id:'R:'+t.id, kind:'trend', ref:t, r:5.5, x:W0/2 + (Math.random()-.5)*80, y:H0/2 + (Math.random()-.5)*80, cx:W0/2, cy:H0/2, color:'#ffd27a', fam:null};
  nodes.push(n); nodeById.set(n.id, n);
  (t.atoms || []).forEach(id => byId.has(id) && links.push({source:n.id, target:id, kind:'trend'}));
});
const degree = new Map();
links.forEach(l => { if (l.kind !== 'home') { degree.set(l.source, (degree.get(l.source)||0) + 1); degree.set(l.target, (degree.get(l.target)||0) + 1); } });
nodes.forEach(n => { if (n.kind === 'atom') n.r = 2.8 + Math.min(4, (degree.get(n.id) || 0) * .45); });

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id)
    .distance(l => l.kind === 'home' ? 46 : l.kind === 'syn' ? 26 : 70)
    .strength(l => l.kind === 'home' ? .05 : l.kind === 'syn' ? .035 : .02))
  .force('charge', d3.forceManyBody().strength(d => d.kind === 'topic' ? -140 : -15).distanceMax(170))
  .force('x', d3.forceX(d => d.cx).strength(d => d.kind === 'atom' ? .16 : .02))
  .force('y', d3.forceY(d => d.cy).strength(d => d.kind === 'atom' ? .16 : .02))
  .force('collide', d3.forceCollide(d => d.r + 1.4))
  .stop();
for (let i = 0; i < 340; i++) sim.tick();
const adj = new Map(nodes.map(n => [n.id, new Set()]));
links.forEach(l => { if (l.kind !== 'home') { adj.get(l.source.id).add(l.target.id); adj.get(l.target.id).add(l.source.id); } });
const synLinks = links.filter(l => l.kind === 'syn'), trendLinks = links.filter(l => l.kind === 'trend');

/* ---------- canvas ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), brain = document.getElementById('brain');
let cw = 0, ch = 0, dpr = 1, tr = d3.zoomIdentity;
let selected = null, hovered = null, lit = null, litLabel = '', pulses = [], rings = [];
const zoom = d3.zoom().scaleExtent([.35, 7]).on('zoom', e => { tr = e.transform; wake(); });
d3.select(cv).call(zoom).on('dblclick.zoom', null);
function fit(animate){
  const k = Math.min(cw / W0, ch / H0) * .96;
  const t = d3.zoomIdentity.translate((cw - W0 * k) / 2, (ch - H0 * k) / 2).scale(k);
  (animate && !reduced ? d3.select(cv).transition().duration(500) : d3.select(cv)).call(zoom.transform, t);
}
new ResizeObserver(() => {
  dpr = Math.min(2, devicePixelRatio || 1); cw = brain.clientWidth; ch = brain.clientHeight;
  cv.width = cw * dpr; cv.height = ch * dpr; fit(false); wake();
}).observe(brain);

const visible = n => n.kind !== 'atom' && n.kind !== 'topic' ? true : famOn[n.fam];
function alphaFor(n){
  if (!visible(n)) return .05;
  if (selected) return (n.id === selected.id || adj.get(selected.id).has(n.id) || (lit && lit.has(n.id))) ? 1 : .12;
  if (lit) return lit.has(n.id) || n.kind === 'topic' ? 1 : .1;
  return n.kind === 'trend' ? .75 : .92;
}
function draw(now){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cw, ch);
  ctx.save(); ctx.translate(tr.x, tr.y); ctx.scale(tr.k, tr.k);
  const lw = 1 / tr.k;
  // synapses
  for (const l of synLinks) {
    const a = l.source, b = l.target;
    let al = Math.min(alphaFor(a), alphaFor(b)) * .16;
    if (selected && (a.id === selected.id || b.id === selected.id)) al = .7;
    else if (lit && lit.has(a.id) && lit.has(b.id)) al = .32;
    ctx.strokeStyle = a.color; ctx.globalAlpha = al; ctx.lineWidth = lw * (al > .3 ? 1.4 : 1);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // trend wiring (only when a trend is in focus)
  for (const l of trendLinks) {
    const a = l.source, b = l.target, on = (selected && (selected.id === a.id)) || (lit && lit.has(a.id));
    if (!on) continue;
    ctx.strokeStyle = '#ffd27a'; ctx.globalAlpha = .55; ctx.setLineDash([4 * lw, 4 * lw]); ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
  }
  // neurons
  for (const n of nodes) {
    const al = alphaFor(n); ctx.globalAlpha = al;
    if (n.kind === 'topic') {
      ctx.fillStyle = n.color; ctx.globalAlpha = al * .16; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 2.1, 0, 7); ctx.fill();
      ctx.globalAlpha = al; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
    } else if (n.kind === 'trend') {
      ctx.fillStyle = '#ffd27a'; ctx.beginPath(); ctx.moveTo(n.x, n.y - n.r * 1.3); ctx.lineTo(n.x + n.r, n.y); ctx.lineTo(n.x, n.y + n.r * 1.3); ctx.lineTo(n.x - n.r, n.y); ctx.closePath(); ctx.fill();
    } else {
      const big = (lit && lit.has(n.id)) || (selected && adj.get(selected.id).has(n.id));
      if (big) { ctx.globalAlpha = .22; ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 2.6, 0, 7); ctx.fill(); ctx.globalAlpha = al; }
      ctx.fillStyle = n.color; ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill();
      if (n.ref.c.length) { ctx.strokeStyle = '#ff5d73'; ctx.lineWidth = 1.2 * lw; ctx.globalAlpha = al * .9; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 1.8 * lw + .6, 0, 7); ctx.stroke(); }
    }
  }
  // signals travelling along synapses
  ctx.globalCompositeOperation = 'lighter';
  pulses = pulses.filter(p => p.t < 1);
  for (const p of pulses) {
    p.t += p.v; const e = p.t < .5 ? 2 * p.t * p.t : 1 - Math.pow(-2 * p.t + 2, 2) / 2;
    const x = p.a.x + (p.b.x - p.a.x) * e, y = p.a.y + (p.b.y - p.a.y) * e;
    ctx.globalAlpha = p.al * .35; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(x, y, 5 * lw + 1.2, 0, 7); ctx.fill();
    ctx.globalAlpha = p.al; ctx.fillStyle = '#fff6df'; ctx.beginPath(); ctx.arc(x, y, 1.6 * lw + .7, 0, 7); ctx.fill();
    if (p.t >= 1 && p.chain) p.chain();
  }
  rings = rings.filter(r => r.t < 1);
  for (const r of rings) { r.t += .025; ctx.globalAlpha = (1 - r.t) * .8; ctx.strokeStyle = r.c; ctx.lineWidth = 2 * lw; ctx.beginPath(); ctx.arc(r.n.x, r.n.y, r.n.r + r.t * 26, 0, 7); ctx.stroke(); }
  ctx.globalCompositeOperation = 'source-over';
  // labels
  ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const n of nodes) if (n.kind === 'topic') {
    ctx.globalAlpha = visible(n) ? .95 : .25;
    ctx.font = `400 ${15 / Math.sqrt(tr.k)}px Anton, Impact, sans-serif`; ctx.fillStyle = '#ecebf4';
    ctx.fillText(n.ref.label.toUpperCase(), n.x, n.y - n.r - 11 / Math.sqrt(tr.k));
  }
  const labelSet = new Set();
  if (selected) { labelSet.add(selected.id); adj.get(selected.id).forEach(id => labelSet.add(id)); }
  if (hovered) labelSet.add(hovered.id);
  if (tr.k > 2.6) nodes.forEach(n => { if (n.kind !== 'topic' && alphaFor(n) > .5) labelSet.add(n.id); });
  ctx.font = `500 ${11.5 / tr.k}px 'Instrument Sans', system-ui, sans-serif`;
  for (const id of labelSet) {
    const n = nodeById.get(id); if (!n || n.kind === 'topic') continue;
    const txt = n.kind === 'trend' ? '🔥 ' + n.ref.name : n.ref.t;
    ctx.globalAlpha = .95; ctx.lineWidth = 3 / tr.k; ctx.strokeStyle = '#0a0c13'; ctx.strokeText(txt, n.x, n.y + n.r + 9 / tr.k);
    ctx.fillStyle = id === selected?.id ? '#ffd27a' : '#ecebf4'; ctx.fillText(txt, n.x, n.y + n.r + 9 / tr.k);
  }

}
let rafOn = false, lastAmbient = 0;
function loop(now){
  if (!reduced && now - lastAmbient > 260 && synLinks.length) {
    lastAmbient = now;
    const pool = selected ? synLinks.filter(l => l.source.id === selected.id || l.target.id === selected.id)
               : lit ? synLinks.filter(l => lit.has(l.source.id) && lit.has(l.target.id)) : synLinks;
    const l = (pool.length ? pool : synLinks)[Math.floor(Math.random() * (pool.length || synLinks.length))];
    if (visible(l.source) && visible(l.target)) {
      const fwd = Math.random() < .5;
      pulses.push({a: fwd ? l.source : l.target, b: fwd ? l.target : l.source, t: 0, v: .012 + Math.random() * .01, c: l.source.color, al: pool.length && (selected || lit) ? .95 : .55});
    }
  }
  draw(now);
  if (reduced) { rafOn = false; return; }
  requestAnimationFrame(loop);
}
function wake(){ if (reduced) { requestAnimationFrame(draw); return; } if (!rafOn) { rafOn = true; requestAnimationFrame(loop); } }
wake();

function fire(from, ids, color){
  if (reduced) return;
  ids.forEach((id, i) => { const b = nodeById.get(id); if (b) setTimeout(() => pulses.push({a: from, b, t: 0, v: .03, c: color || from.color, al: 1}), i * 70); });
}
function firePath(order){
  if (reduced || order.length < 2) return;
  let i = 0;
  const step = () => { if (i >= order.length - 1 || pulses.length > 400) return; const a = nodeById.get(order[i]), b = nodeById.get(order[i + 1]); i++; if (a && b) pulses.push({a, b, t: 0, v: .06, c: '#ffd27a', al: 1, chain: step}); else step(); };
  step();
}

/* hit testing */
function pick(mx, my){
  const [x, y] = tr.invert([mx, my]); let best = null, bd = Infinity;
  for (const n of nodes) { if (!visible(n)) continue; const d = Math.hypot(n.x - x, n.y - y); const rr = n.r + 6 / tr.k; if (d < rr && d < bd) { bd = d; best = n; } }
  return best;
}
const tip = document.getElementById('tip');
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), n = pick(e.clientX - r.left, e.clientY - r.top);
  if (n !== hovered) { hovered = n; cv.classList.toggle('hovering', !!n); wake(); }
  if (n && e.pointerType === 'mouse') { tip.hidden = false; tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.textContent = n.kind === 'topic' ? `${n.ref.label} · ${n.ref.n} ideas` : n.kind === 'trend' ? '🔥 ' + n.ref.name : n.ref.t; }
  else tip.hidden = true;
});
cv.addEventListener('pointerleave', () => { hovered = null; tip.hidden = true; wake(); });
cv.addEventListener('click', e => {

/* ---------- search (also powers Ask) ---------- */
const STOP = new Set('a an and are as at be but by do for from how i if in into is it its me my of on or so that the their them then there these this to was what when where which who why will with you your'.split(' '));
const tok = s => String(s).toLowerCase().replace(/[^a-z0-9+#\s-]/g, ' ').split(/[\s-]+/).filter(w => w.length > 1 && !STOP.has(w));
const docs = D.atoms.map(a => ({a, title: tok(a.t), body: tok(a.x + ' ' + a.h + ' ' + a.tp + ' ' + a.st + ' ' + a.n.join(' ') + ' ' + a.f.join(' '))}));
const dfm = new Map(); docs.forEach(d => new Set([...d.title, ...d.body]).forEach(w => dfm.set(w, (dfm.get(w) || 0) + 1)));
function search(q, f = {}){
  const terms = tok(q); if (!terms.length) return [];
  const N = docs.length, out = [];
  for (const d of docs) {
    const a = d.a;
    if (f.topic && a.tp !== f.topic) continue;
    if (f.format && !a.f.includes(f.format)) continue;
    if (f.niche && f.niche !== 'all' && !(a.n.includes(f.niche) || a.n.includes('all'))) continue;
    let s = 0;
    for (const w of terms) {
      const idf = Math.log(1 + N / (dfm.get(w) || .5));
      const tm = d.title.filter(x => x.startsWith(w)).length, bm = d.body.filter(x => x.startsWith(w)).length;
      s += idf * (tm * 3 + Math.min(bm, 3));
    }
    if (s > 0) out.push({a, s});
  }
  out.sort((x, y) => y.s - x.s);
  return out.map(x => x.a);
}

/* Pathway */
const path = store.get('path', {fmt: 'reel30', niche: 'gym'});
function renderPath(){
  const nicheIdeas = a => a.n.includes(path.niche) && path.niche !== 'all';
  const pool = D.atoms.filter(a => a.f.includes(path.fmt) && (path.niche === 'all' || a.n.includes('all') || a.n.includes(path.niche)));
  const trends = D.trends.filter(t => (t.formats || []).includes(path.fmt) && (path.niche === 'all' || t.niche === path.niche || t.niche === 'general'));
  const nm = x => path.niche === 'all' || (x.niches || [x.niche]).flat().includes(path.niche) || (x.niches || []).includes('all');
  const memes = D.library.memes.filter(nm).slice(0, 8), trans = D.library.transitions.filter(nm).slice(0, 8);
  let h = `<h3>Pathway</h3><p class="sub">Pick a format and niche. The map lights every idea that applies, in the order you'd use it, from idea to analysis.</p>
    <div class="chips" role="group" aria-label="Format">${D.formats.map(f => `<button aria-pressed="${f.id === path.fmt}" data-fmt="${f.id}">${esc(f.label)}</button>`).join('')}</div>
    <div class="chips" role="group" aria-label="Niche">${D.niches.map(n => `<button aria-pressed="${n === path.niche}" data-niche="${n}">${n === 'all' ? 'Any niche' : n[0].toUpperCase() + n.slice(1)}</button>`).join('')}</div>
    <p class="sub"><b style="color:var(--fg)">${pool.length}</b> ideas · ${pool.filter(a => a.c.length).length} touch an open clash · ${trends.length} live trends</p>`;
  for (const st of D.stages) {
    const g = pool.filter(a => a.st === st); if (!g.length) continue;
    g.sort((x, y) => nicheIdeas(y) - nicheIdeas(x));
    h += `<div class="stage"><b>${st}</b><span>${g.length}</span></div><div class="items">${g.map(a => itemHTML(a, nicheIdeas(a) ? `<span class="badge n">${esc(path.niche)}</span>` : '')).join('')}</div>`;
  }
  if (trends.length) h += `<h3>Trending in this lane</h3>` + trends.map(trendCard).join('');
  if (trans.length || memes.length) {
    h += `<h3>Toolkit</h3>`;
    if (trans.length) h += `<div class="row"><span class="lbl">Transitions</span>${trans.map(x => `<span class="chip" title="${esc(x.when || x.what || '')}">${esc(x.name)}</span>`).join('')}</div>`;
    if (memes.length) h += `<div class="row"><span class="lbl">Memes</span>${memes.map(x => `<span class="chip" title="${esc(x.timing || '')}">${esc(x.name)}</span>`).join('')}</div>`;

function md(s){
  const lines = esc(s).split('\n'); let h = '', inList = false;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\[A:([a-z0-9-]+)\/([a-z0-9-]+)\]/g, (m, d, o) => {
    const dim = appById.get(d), opt = dim?.options.find(x => x.id === o);
    return opt ? `<button class="cite" data-dimgo="${d}">◇ ${esc(opt.name)}</button>` : m; }).replace(/\[([A-Za-z0-9][A-Za-z0-9-]*)\]/g, (m, id) => {
    if (byId.has(id)) return `<button class="cite" data-go="${id}">${esc(byId.get(id).t)}</button>`;
    if (clashById.has(id)) return `<button class="cite c" data-clash="${id}">⚠ ${id}</button>`;
    if (trendById.has(id)) return `<button class="cite" data-trend="${id}">🔥 ${esc(trendById.get(id).name)}</button>`;
    if (srcById.has(id)) return `<button class="cite" data-src="${id}">${id}</button>`;
    return m; });
  for (const l of lines) {
    const m = l.match(/^\s*[-*•]\s+(.*)/);
    if (m) { if (!inList) { h += '<ul>'; inList = true; } h += `<li>${inline(m[1])}</li>`; continue; }
    if (inList) { h += '</ul>'; inList = false; }
    if (l.trim()) h += `<p>${inline(l.replace(/^#+\s*/, ''))}</p>`;
  }
  return h + (inList ? '</ul>' : '');
}

async function ask(){
  const q = askBox().value.trim(), out = document.getElementById('answer'), note = document.getElementById('asknote');

    setLit(new Set(hits.map(a => a.id)), 'search'); return;
  }
  const rules = `You are the Master Mind: the knowledge base of Srijan, a creator (Instagram @srijan_jaiswall, Pune, India; niches gym, tech/PC, gaming, travel; iPhone 15 on a tripod; edits in Instagram Edits, CapCut and VN; English or Hinglish captions).
Answer ONLY from the Brain, which you reach through the tools. Search 2-4 times with different wording before answering, and open ideas you rely on with get_idea when useful.

If the Brain has nothing on a point, say so plainly and call it a gap.
When the question is about ideating or making something, use get_approaches: pick the 2-4 style dimensions that matter most and lay out routes (Route A, Route B…): for each, what the reel would look like, what it is good at and weak at. Cite an approach option as [A:dimension-id/option-id]. Do not pick one route for the viewer unless asked; you may say which goal each route serves.

Approach dimensions (style menus): ${APP.map(d => d.id).join(', ')}.
The Brain has ${D.atoms.length} ideas in topics: ${D.topics.map(t => `${t.id} (${t.n})`).join(', ')}.
Stages: ${D.stages.join(' → ')}. Formats: ${D.formats.map(f => `${f.id} = ${f.label}`).join('; ')}.

${tab === 'ask' && path ? `The viewer's last pathway choice: ${fmtLabel[path.fmt]}, niche ${path.niche}.` : ''}${selected?.kind === 'atom' ? ` The idea open on the map: [${selected.id}].` : ''}

Question: ${q}`;
  const lim = await sampleFn.limits?.().catch(() => null);
  const canTools = !!lim?.tools;
  const prompt = canTools ? rules : rules + '\n\nYou have no tools in this view. The closest ideas from a local search are below; answer from them.\n' + JSON.stringify(search(q).slice(0, 30).map(slim));

  const wrapTools = TOOLS.map(t => ({...t, execute: (i, c) => { const r = t.execute(i, c); note.textContent = `Searching: ${t.name.replace('_', ' ')} ${i.query || i.id || i.niche || i.kind || ''}`; if (Array.isArray(r)) { const ids = r.map(x => x.id).filter(id => byId.has(id) && !fired.has(id)); ids.forEach(id => fired.add(id)); setLit(new Set(fired), 'thinking…'); firePath(ids.slice(0, 8)); } return r; }}));
  try {
    const res = await sampleFn(prompt, {...(canTools ? {tools: wrapTools} : {cache: false}), signal: askCtl.signal, onText: ({text}) => { out.innerHTML = md(text); }});
    out.innerHTML = md(res.text); wireCites(out);

  } catch (e) {
    if (e?.text) out.innerHTML = md(e.text);
    const msg = {cancelled: '', not_granted: 'Claude is not allowed for this page, so here is a local search instead.', sampling_disabled: 'Claude is not available on this account. Showing a local search.', tools_unavailable: 'This view cannot run the Brain\'s search tools. Showing a local search.', rate_limited: 'Too many questions just now. Try again in a minute.', session_expired: 'Sign in to claude.ai again, then ask.', refused: 'Claude declined this question. Try wording it differently.'}[e?.code];
    if (['not_granted', 'sampling_disabled', 'tools_unavailable', 'not_declared', 'capability_disabled'].includes(e?.code)) { sampleFn = null; const hits = search(q).slice(0, 8); out.innerHTML = `<div class="items">${hits.map(a => itemHTML(a)).join('')}</div>`; }
    note.textContent = msg ?? (e?.code === 'cancelled' ? 'Stopped.' : 'Something went wrong reaching Claude. Try again.');

/* ---------- time helpers & the chapter ring ---------- */
function toSec(t){ const m = String(t || '').match(/(\d+):(\d{1,2})(?::(\d{1,2}))?/); if (!m) return null; return m[3] != null ? +m[1] * 3600 + +m[2] * 60 + +m[3] : +m[1] * 60 + +m[2]; }
function lenSec(s){ s = String(s || ''); const h = s.match(/(\d+)\s*h/), m = s.match(/(\d+)\s*m/), sec = s.match(/(\d+)\s*s\b/); return (h ? +h[1] * 3600 : 0) + (m ? +m[1] * 60 : 0) + (sec ? +sec[1] : 0); }
function chapterWeights(c){
  const ch = c.chapters || [], n = ch.length;
  if (n < 2) return ch.map(() => 1);
  const st = ch.map(x => toSec(String(x.time || '').split(/[–—-]/)[0]));
  const total = lenSec(c.length);
  if (st.some(x => x == null) || st.some((x, i) => i && x < st[i - 1])) return ch.map(() => 1);
  return st.map((x, i) => Math.max(1, (i < n - 1 ? st[i + 1] : Math.max(total, x + (total ? 0 : 60))) - x));
}
function arc(cx, cy, r, a0, a1){ const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)]; const [x0, y0] = p(a0), [x1, y1] = p(a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; }
function ringSVG(c, hero){
  const w = chapterWeights(c), tot = w.reduce((a, b) => a + b, 0) || 1, gap = w.length > 1 ? .035 : 0;
  let a = -Math.PI / 2, segs = '';
  w.forEach((x, i) => { const a1 = a + x / tot * Math.PI * 2; segs += `<path d="${arc(100, 100, 74, a + gap / 2, a1 - gap / 2)}" stroke="${PAL[i % 6]}" stroke-width="${hero ? 26 : 22}" fill="none" ${hero ? `data-ch="${i}" style="cursor:pointer"` : ''}><title>${esc(pad(i) + ' ' + (c.chapters[i]?.title || ''))}</title></path>`; a = a1; });
  return `<svg class="ring" viewBox="0 0 200 200" aria-hidden="${hero ? 'false' : 'true'}" role="${hero ? 'img' : 'presentation'}" aria-label="Chapters sized by length">${segs}<text x="100" y="${hero ? 106 : 104}" text-anchor="middle" fill="var(--fg)" style="font:400 ${hero ? 44 : 34}px Anton, Impact, sans-serif">${w.length}</text><text x="100" y="${hero ? 128 : 122}" text-anchor="middle" fill="var(--muted)" style="font:500 10px 'JetBrains Mono', monospace;letter-spacing:.12em">CHAPTERS</text></svg>`;
}
const readSet = id => new Set(store.get('read:' + id, []));
const progress = c => Math.round(readSet(c.id).size / Math.max(1, (c.chapters || []).length) * 100);

/* ---------- Learn: diagrams ---------- */
const it = x => typeof x === 'string' ? {label: x, text: ''} : (x || {});
function cycleSVG(items){
  const n = items.length, R = 80, cx = 120, cy = 120;
  const pts = items.map((_, i) => { const a = -Math.PI / 2 + i / n * Math.PI * 2; return [cx + R * Math.cos(a), cy + R * Math.sin(a), a]; });
  let arcs = '';
  pts.forEach((p, i) => { const a0 = p[2] + .32, a1 = (i === n - 1 ? pts[0][2] + Math.PI * 2 : pts[i + 1][2]) - .32; arcs += `<path d="${arc(cx, cy, R, a0, a1)}" stroke="var(--line)" stroke-width="3" fill="none" marker-end="url(#ah)"/>`; });
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Cycle diagram"><defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs>${arcs}
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="19" fill="${PAL[i % 6]}"/><text x="${p[0]}" y="${p[1] + 7}" text-anchor="middle" fill="#16120a" style="font:400 20px Anton, Impact, sans-serif">${i + 1}</text>`).join('')}
    <text x="120" y="126" text-anchor="middle" fill="var(--muted)" style="font:500 10px 'JetBrains Mono', monospace;letter-spacing:.14em">REPEAT</text></svg>`;
}
function vennSVG(items){
  const three = items.length >= 3, c = three ? [[96, 102], [144, 102], [120, 146]] : [[98, 120], [142, 120]], r = three ? 58 : 64;
  return `<svg viewBox="0 0 240 240" role="img" aria-label="Venn diagram">${c.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${PAL[i % 6]}" fill-opacity=".28" stroke="${PAL[i % 6]}" stroke-width="2"/>`).join('')}
    ${c.map((p, i) => { const dx = p[0] - 120, dy = p[1] - (three ? 117 : 120); return `<text x="${p[0] + dx * .7}" y="${p[1] + dy * .7 + 5}" text-anchor="middle" fill="var(--fg)" style="font:400 18px Anton, Impact, sans-serif">${i + 1}</text>`; }).join('')}
    <text x="120" y="${three ? 124 : 125}" text-anchor="middle" fill="var(--spark)" style="font:400 20px Anton, Impact, sans-serif">★</text></svg>`;
}
const legend = items => `<ol class="legend-list">${items.map((x, i) => { x = it(x); return `<li style="--c:${PAL[i % 6]}"><i>${i + 1}</i><div><b>${esc(x.label)}</b><span>${esc(x.text)}</span></div></li>`; }).join('')}</ol>`;
function frameworkHTML(b){
  const items = (b.items || []).map(it), n = items.length, title = b.title ? `<h4 class="fw-title">${esc(b.title)}</h4>` : '';
  let body = '';
  switch (b.style) {
    case 'cycle': body = `<div class="svgfw">${cycleSVG(items)}${legend(items)}</div>`; break;
    case 'venn': body = `<div class="svgfw">${vennSVG(items)}${legend(items)}</div>`; break;
    case 'funnel': body = `<div class="layers">${items.map((x, i) => `<div class="layer" style="width:${100 - i * (50 / Math.max(1, n - 1))}%;background:${PAL[i % 6]};clip-path:polygon(0 0,100% 0,${100 - 4}% 100%,4% 100%)"><b>${esc(x.label)}</b>${x.text ? `<span>${esc(x.text)}</span>` : ''}</div>`).join('')}</div>`; break;
    case 'pyramid': { const top = items.slice().reverse(); body = `<div class="layers">${top.map((x, j) => `<div class="layer" style="width:${40 + j * (60 / Math.max(1, n - 1))}%;background:${PAL[(n - 1 - j) % 6]}"><b>${esc(x.label)}</b>${x.text ? `<span>${esc(x.text)}</span>` : ''}</div>`).join('')}</div><p class="fw-cap" style="text-align:center">Base first: build from the bottom up.</p>`; break; }
    case 'ladder': body = `<div class="ladder"><div class="end">Abstract</div>${items.map(x => `<div class="rung"><b>${esc(x.label)}</b><span>${esc(x.text)}</span></div>`).join('')}<div class="end">Concrete</div></div>`; break;
    case 'matrix': { const q = items.slice(0, 4), ax = b.axes || {}; body = `<div class="matrix"><div class="ax ay" style="grid-row:1/3">${esc(ax.y || '')}</div>${q.map((x, i) => `<div class="cell" style="border-color:${PAL[i % 6]}55"><b>${esc(x.label)}</b><span>${esc(x.text)}</span></div>`).join('')}<div></div><div class="ax" style="grid-column:2/4">${esc(ax.x || '')}</div></div>`; break; }
    case 'timeline': body = `<div class="tl">${items.map(x => `<div class="pt"><b>${esc(x.label)}</b><span>${esc(x.text)}</span></div>`).join('')}</div>`; break;
    case 'equation': body = `<div class="eq">${items.map((x, i) => `${i ? `<span class="op">${i === n - 1 ? '=' : '+'}</span>` : ''}<div class="tile ${i === n - 1 && n > 1 ? 'res' : ''}"><b>${esc(x.label)}</b><span>${esc(x.text)}</span></div>`).join('')}</div>`; break;
    default: body = `<div class="steps">${items.map((x, i) => `<div class="step" style="--c:${PAL[i % 6]}"><span class="n">${i + 1}</span><b>${esc(x.label)}</b><p>${esc(x.text)}</p></div>`).join('')}</div>`;
  }
  return `<div class="fw">${title}${body}${b.caption ? `<p class="fw-cap">${esc(b.caption)}</p>` : ''}</div>`;
}
function blockHTML(b, key){
  switch (b.type) {

    case 'quote': return `<blockquote class="bq"><p>“${esc(b.text)}”</p><cite>${esc(b.who || '')}${b.time ? ' · ' + esc(b.time) : ''}</cite></blockquote>`;

worlds.learn.addEventListener('click', e => {

  if (b.dataset.mark != null) {

const ideaFilter = {fmt: 'all', diff: 'all', topic: ''};

function viralHTML(V){

      ${outl.length > 15 ? `<details class="creators" style="margin-top:8px"><summary>All ${outl.length} outliers</summary><div class="ctable"><table class="vt"><tbody>${outl.slice(15).map(row).join('')}</tbody></table></div></details>` : ''}` : ''}
    ${(V.formulas || []).length ? `<h3 class="display" style="font-size:24px;margin:22px 0 8px">Hook formulas that over-index</h3><div class="fbars">${V.formulas.map(f => `<div class="fbar"><span>${esc(f.name || f.id)}</span><i style="width:${Math.round((+f.top_third || 0) / maxF * 100)}%"></i><b>${esc(f.top_third ?? '')} top · ${esc(f.bottom_third ?? '')} bottom</b>${f.note ? `<em>${esc(f.note)}</em>` : ''}</div>`).join('')}</div>` : ''}

    <div class="vcols">${list('Works', V.works, 'ok')}${list("Doesn't work", V.doesnt, 'no')}${list('Can work for you', V.can_work, 'can')}</div>

function wireIdeas(){
